# TestFlight配布（署名あり）。Actions の「Run workflow」から手動実行する。
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   APPLE_TEAM_ID / APPLE_CERT_P12_BASE64 / APPLE_CERT_PASSWORD /
#   APPSTORE_ISSUER_ID / APPSTORE_KEY_ID / APPSTORE_PRIVATE_KEY
# Secrets が未設定のうちは実行しても失敗するだけ（＝手動実行のみにしてある）。
name: testflight

on:
  workflow_dispatch:

jobs:
  # 型・Lint・テストが通らないものは配信しない（前段ゲート）。
  # 実機に配る一歩手前が最後の砦なので、ここは必ず通す。
  test:
    uses: ./.github/workflows/test.yml

  # Secrets 不要。Fastfile が壊れていないか（読み込めるか）だけ確認する
  fastlane-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Fastfile を読み込めるか確認
        run: bundle exec fastlane lanes

  upload:
    needs: [test, fastlane-syntax]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 必要な Secrets が揃っているか確認
        run: |
          # APPSTORE_ISSUER_ID は任意（個人用APIキーには Issuer ID が無いため）
          missing=""
          for k in APPLE_TEAM_ID APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!k}" ]; then missing="$missing $k"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::次のSecretsが未設定です:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install dependencies
        run: npm ci

      # capacitor.config.ts → ネイティブ設定へ反映＋Package.swift 再生成
      - name: Capacitor sync
        run: npx cap sync ios

      - name: TestFlight へアップロード
        run: bundle exec fastlane ios beta

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cooksync-ipa
          path: build/*.ipa
          if-no-files-found: warn
